{% extends "base.html" %}

{% block title %}Registro sostenible | SCM SimLab 360{% endblock %}

{% block content %}
<section class="auth-panel">
  <h1>Registro de sostenibilidad</h1>
  <p>Empresa: {{ company.name }}</p>
  <form method="post" class="form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="primary">Guardar registro</button>
  </form>
</section>
{% endblock %}
