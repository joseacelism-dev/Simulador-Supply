{% extends "base.html" %}

{% block title %}Crear devolucion | SCM SimLab 360{% endblock %}

{% block content %}
<section class="auth-panel">
  <h1>Crear solicitud de devolucion</h1>
  <p>Empresa: {{ company.name }}</p>
  <form method="post" class="form">
    {% csrf_token %}
    {{ return_form.as_p }}
    {{ line_form.as_p }}
    <button type="submit" class="primary">Guardar devolucion</button>
  </form>
</section>
{% endblock %}
