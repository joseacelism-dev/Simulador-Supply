{% extends "base.html" %}

{% block title %}Crear BOM | SCM SimLab 360{% endblock %}

{% block content %}
<section class="auth-panel">
  <h1>Crear BOM</h1>
  <p>Empresa: {{ company.name }}</p>
  <form method="post" class="form">
    {% csrf_token %}
    {{ bom_form.as_p }}
    {{ line_form.as_p }}
    <button type="submit" class="primary">Guardar BOM</button>
  </form>
</section>
{% endblock %}
