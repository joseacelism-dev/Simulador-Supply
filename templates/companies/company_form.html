{% extends "base.html" %}

{% block title %}Crear empresa | SCM SimLab 360{% endblock %}

{% block content %}
<section class="auth-panel">
  <h1>Crear empresa</h1>
  <p>Define la configuracion inicial de tu empresa para preparar los catalogos base.</p>
  <form method="post" class="form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="primary">Guardar empresa</button>
  </form>
</section>
{% endblock %}
