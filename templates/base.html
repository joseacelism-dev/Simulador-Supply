{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SCM SimLab 360{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{% url 'home' %}">SCM SimLab 360</a>
    <nav class="nav">
      {% if user.is_authenticated %}
        <a href="{% url 'accounts:post_login_redirect' %}">Panel</a>
        <form method="post" action="{% url 'accounts:logout' %}">
          {% csrf_token %}
          <button type="submit">Salir</button>
        </form>
      {% else %}
        <a href="{% url 'accounts:login' %}">Ingresar</a>
        <a class="button-link" href="{% url 'accounts:register' %}">Registrarme</a>
      {% endif %}
    </nav>
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
